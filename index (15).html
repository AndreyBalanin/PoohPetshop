<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#1d1d1b;--muted:#8a8a85;--accent:#2f9e6f;--accent-t:#fff;--chip:#ebebe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1f2127;--text:#f1f1ee;--muted:#8d8f96;--chip:#2a2d35}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1f2127;--text:#f1f1ee;--muted:#8d8f96;--chip:#2a2d35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.scr{display:none}.scr.on{display:block}
h1{margin:0;font-size:22px}
.meta{color:var(--muted);font-size:13px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer}
input,select{width:100%;border:0;background:var(--chip);color:var(--text);padding:12px 14px;border-radius:12px;font-size:15px;outline:none;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips:empty{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-t)}
.hero{text-align:center;padding:60px 14px 24px}.hero .logo{font-size:64px}
.big{display:block;width:calc(100% - 28px);margin:12px 14px;padding:20px;border:0;border-radius:18px;background:var(--card);color:var(--text);font-size:19px;font-weight:700;text-align:left;cursor:pointer}
.big span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px}
.tiles,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 14px}
.tile{position:relative;aspect-ratio:1;border:0;border-radius:18px;overflow:hidden;background:var(--chip);cursor:pointer;padding:0}
.tile .te{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;padding-bottom:20px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 10px;color:#fff;text-align:left;font-size:15px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.card{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column}
.pic{height:96px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.name{margin:8px 0 2px;font-weight:600;min-height:38px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:700}
.btn{border:0;background:var(--accent);color:var(--accent-t);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:14px}
.step{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px}
.step button{border:0;background:none;color:var(--text);font-size:18px;width:30px;height:32px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 14px;grid-column:1/-1}
.sec{padding:4px 14px;font-weight:700;font-size:17px}
.form{padding:6px 14px}
.photo{display:flex;align-items:center;justify-content:center;height:70px;border-radius:12px;border:2px dashed var(--muted);color:var(--muted);margin-bottom:10px;cursor:pointer}
#prev{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px}
#prev[hidden]{display:none}
.form .btn{width:100%;padding:14px;font-size:16px;border-radius:12px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin:0 14px 8px}
.item .e{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.item .e img{width:100%;height:100%;object-fit:cover}.item .t{flex:1}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;background:var(--accent);color:var(--accent-t);border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;z-index:6}
.bar.show{display:flex}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 14px 10px;font-size:19px}
.total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin:12px 14px}
.panel .btn{width:calc(100% - 28px);margin:0 14px;padding:14px;font-size:16px;border-radius:12px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 10px}
.k{background:var(--card);border-radius:12px;padding:10px}.k b{display:block;font-size:18px;margin-top:2px}
.tr{display:grid;grid-template-columns:2.2fr .8fr 1.4fr 1.3fr;gap:6px;padding:8px 14px;border-bottom:1px solid var(--chip);font-size:13px;align-items:start}
.tr.h{font-weight:700;color:var(--muted)}.tr.s{grid-template-columns:2fr .8fr .8fr 1.4fr 1fr}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;padding:0 14px;overflow:hidden}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
</style>
</head>
<body>

<section id="role" class="scr">
  <div class="hero"><div class="logo">🐾</div><h1>Pet Shop</h1><p class="meta">Выберите, как вы хотите зайти</p></div>
  <button class="big" data-a="role" data-r="buyer">🛍️ Я покупатель<span>Смотреть товары и делать заказы</span></button>
  <button class="big" data-a="role" data-r="seller">📦 Я продавец<span>Публиковать свои товары</span></button>
  <button class="big" id="adminbtn" data-a="role" data-r="admin" style="display:none">🛠 Админ<span>Заявки продавцов и модерация товаров</span></button>
</section>

<section id="buyer" class="scr">
  <header>
    <div class="top"><h1>🐾 Pet Shop</h1><button class="link" data-a="orders">Мои заказы</button><button class="link" data-a="switch">Сменить роль</button></div>
    <input id="q" placeholder="Поиск товаров" autocomplete="off">
    <div class="chips" id="chips"></div>
  </header>
  <div id="main"></div>
</section>

<section id="seller" class="scr">
  <header><div class="top"><h1>📦 Кабинет продавца</h1><button class="link" data-a="switch">Сменить роль</button></div></header>
  <div id="sbody"></div>
</section>

<section id="admin" class="scr">
  <header><div class="top"><h1>🛠 Админ</h1><button class="link" data-a="switch">Сменить роль</button></div></header>
  <div id="abody"></div>
</section>

<button class="bar" id="bar" data-a="cart"></button>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
var CUR = "₽";

/* ===== КАТЕГОРИИ =====
   n   - название категории
   e   - эмодзи (показывается, пока нет фото)
   img - ССЫЛКА НА ФОТО КАТЕГОРИИ (сюда вставляйте свои фото)
   t   - виды товаров внутри категории */
var C = [
 {n:"Еда и лакомства", e:"🍖", img:"https://loremflickr.com/400/400/dog,food?lock=1", t:["Корм","Лакомства"]},
 {n:"Одежда и обувь", e:"🧥", img:"https://loremflickr.com/400/400/dog,coat?lock=2", t:["Вязаная одежда","Дождевики","Ботиночки"]},
 {n:"Для дома", e:"🛏️", img:"https://loremflickr.com/400/400/dog,bed?lock=3", t:["Лежанки","Пледы","Чистящие средства"]},
 {n:"Аптечка и витамины", e:"💊", img:"https://loremflickr.com/400/400/veterinary,dog?lock=4", t:["Лекарства","Наборы витаминов","Первая необходимость"]},
 {n:"Игрушки", e:"🎾", img:"https://loremflickr.com/400/400/dog,toy?lock=5", t:["Мячи","Мягкие игрушки","Канаты и грызунки","Интерактивные"]},
 {n:"Для прогулки", e:"🦮", img:"https://loremflickr.com/400/400/dog,leash?lock=6", t:["Шлейки","Поводки","Пакеты для уборки"]},
 {n:"Для ухода", e:"🛁", img:"https://loremflickr.com/400/400/dog,grooming?lock=7", t:["Шампуни","Кондиционеры","Расчёски","Полотенца","Когтерезы","Зубные пасты и щётки"]}
];

/* ===== ТОВАРЫ-ПРИМЕРЫ: категория|вид|название|вес/размер|цена (номера с нуля) ===== */
var SEED = [];

var $ = function(id){return document.getElementById(id)};
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

/* ===== БАЗА ДАННЫХ (Supabase) ===== */
var SB = "https://dtxekqgdurpzoqckazlp.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0eGVrcWdkdXJwem9xY2themxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NzQ3NTksImV4cCI6MjEwNzQ1MDc1OX0.-c3MzL2JOM_GEbLupzh38p8OSP4FeOUWN3v_Dk4lQVs";
var INIT = (tg && tg.initData) || "";
if (!INIT) { try {
  INIT = new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || sessionStorage.getItem("ps_init") || "";
  if (INIT) sessionStorage.setItem("ps_init", INIT);
} catch(e){} }
var UID = null;
try { var uu = new URLSearchParams(INIT).get("user"); if (uu) UID = JSON.parse(uu).id; } catch(e){}
var busy = false;
function loadDb(){
  return fetch(SB+"/rest/v1/products?select=*&order=created_at.desc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(rows){
      MY = rows.map(function(r){return {id:"d"+r.id,c:+r.category,t:+r.type,n:r.name,w:"",p:+r.price,q:+r.qty,ld:+r.lead_days,img:r.img||null}});
      Object.keys(cart).forEach(function(k){if(!byId(k))delete cart[k]});
      if(role==="buyer"){main();bar()}
    })
    .catch(function(){toast("Не удалось загрузить каталог")});
}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Не удалось сохранить: мало места")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(v){return Math.round(v).toLocaleString("ru-RU")+" "+CUR}
function toast(t){var el=$("toast");el.textContent=t;el.style.display="block";setTimeout(function(){el.style.display="none"},2500)}

var MY = [], cart = {}, role = null, cat = null, ty = -1, Q = "", photo = "";
function all(){return SEED.concat(MY)}
function byId(id){return all().filter(function(x){return x.id===id})[0]}
function count(){return Object.keys(cart).reduce(function(s,k){return s+cart[k]},0)}
function sum(){return Object.keys(cart).reduce(function(s,k){var p=byId(k);return s+(p?p.p*cart[k]:0)},0)}
function chg(id,d){var pp=byId(id); if(d>0 && pp && (cart[id]||0)>=pp.q){toast("Больше нет в наличии");return}
  cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; main(); bar(); if($("sheet").classList.contains("show")) openCart()}
function pic(p){return p.img ? '<img src="'+p.img+'" alt="">' : C[p.c].e}
function ctrl(id){
  var pp = byId(id); if(!pp || pp.q<=0) return '<span class="meta">Нет в наличии</span>';
  var q = cart[id]||0;
  return q ? '<div class="step"><button data-a="sub" data-id="'+id+'">−</button><b>'+q+'</b><button data-a="add" data-id="'+id+'">+</button></div>'
           : '<button class="btn" data-a="add" data-id="'+id+'">В корзину</button>';
}

function setRole(r){
  role = r; cat = null; ty = -1; Q = ""; $("q").value = ""; $("sheet").classList.remove("show");
  $("role").classList.toggle("on", !r);
  $("buyer").classList.toggle("on", r==="buyer");
  $("seller").classList.toggle("on", r==="seller");
  $("admin").classList.toggle("on", r==="admin");
  if (r==="buyer") main(); if (r==="seller") sellerInit(); if (r==="admin") adminInit(); if (r) loadDb();
  bar(); window.scrollTo(0,0);
}

function main(){
  var feed = cat!==null || Q, h = "", ch = "";
  if (!feed) {
    h = '<div class="tiles">' + C.map(function(c,i){
      return '<button class="tile" data-a="cat" data-i="'+i+'"><span class="te">'+c.e+'</span><img src="'+c.img+'" alt="" loading="lazy" onerror="this.remove()"><b>'+c.n+'</b></button>';
    }).join("") + '</div>';
  } else {
    ch = '<button class="chip" data-a="home">← Категории</button>';
    if (cat!==null) {
      ch += '<button class="chip'+(ty<0?' on':'')+'" data-a="type" data-i="-1">Все</button>' +
        C[cat].t.map(function(t,i){return '<button class="chip'+(ty===i?' on':'')+'" data-a="type" data-i="'+i+'">'+t+'</button>'}).join("");
    }
    var list = all().filter(function(p){
      return (cat===null||p.c===cat) && (ty<0||p.t===ty) && (p.n+" "+C[p.c].t[p.t]).toLowerCase().indexOf(Q)>-1;
    });
    h = (cat!==null ? '<div class="sec" style="margin-bottom:4px">'+C[cat].n+'</div>' : '') + '<div class="grid">' + (list.length ? list.map(function(p){
      return '<div class="card"><div class="pic">'+pic(p)+'</div><div class="name">'+esc(p.n)+'</div><div class="meta">'+esc(C[p.c].t[p.t])+'</div><div class="meta">Осталось: '+p.q+' шт. · доставка от '+p.ld+' дн.</div><div class="row"><span class="price">'+fmt(p.p)+'</span>'+ctrl(p.id)+'</div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>') + '</div>';
  }
  $("chips").innerHTML = ch; $("main").innerHTML = h;
}

function bar(){
  var n = count(), b = $("bar");
  b.classList.toggle("show", n>0 && role==="buyer");
  b.innerHTML = '<span>Корзина · '+n+'</span><span>'+fmt(sum())+'</span>';
}
var F = {a:"",p:"",d:"",c:""};
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dru(s){var a=s.split("-");return a[2]+"."+a[1]+"."+a[0]}
function earliest(){var m=1;Object.keys(cart).forEach(function(k){var p=byId(k);if(p&&p.ld>m)m=p.ld});var d=new Date();d.setDate(d.getDate()+m);return ymd(d)}
function openCart(){
  var ids = Object.keys(cart);
  if(!ids.length){ $("sheet").classList.remove("show"); return; }
  var e = earliest(); if(!F.d || F.d<e) F.d = e;
  $("panel").innerHTML = '<h2>Корзина</h2>' + ids.map(function(id){
    var p = byId(id);
    return '<div class="item"><span class="e">'+pic(p)+'</span><div class="t">'+esc(p.n)+'<div class="meta">'+fmt(p.p)+'</div></div><div class="step"><button data-a="sub" data-id="'+id+'">−</button><b>'+cart[id]+'</b><button data-a="add" data-id="'+id+'">+</button></div></div>';
  }).join("") +
  '<div class="form"><div class="meta" style="margin-bottom:8px">Ближайшая дата доставки: <b>'+dru(e)+'</b>. Можно выбрать более позднюю.</div>'+
  '<input data-f="d" type="date" min="'+e+'" value="'+F.d+'">'+
  '<input data-f="a" placeholder="Адрес доставки" value="'+esc(F.a)+'">'+
  '<input data-f="p" placeholder="Телефон" inputmode="tel" value="'+esc(F.p)+'">'+
  '<input data-f="c" placeholder="Комментарий (необязательно)" value="'+esc(F.c)+'"></div>'+
  '<div class="total"><span>Итого</span><span>'+fmt(sum())+'</span></div><button class="btn" data-a="co">Оформить заказ</button>';
  $("sheet").classList.add("show");
}
function checkout(){
  if (!INIT) return toast("Нет данных Telegram. Откройте магазин кнопкой меню у бота внутри Telegram");
  if (F.a.trim().length<6) return toast("Введите адрес доставки");
  if (F.p.replace(/\D/g,"").length<10) return toast("Введите телефон");
  if (busy) return; busy = true; toast("Оформляем заказ…");
  var items = Object.keys(cart).map(function(id){return {id:id,qty:cart[id]}});
  api("order",{items:items,address:F.a,phone:F.p,date:F.d,comment:F.c})
    .then(function(){
      cart = {}; F.d = ""; F.c = ""; $("sheet").classList.remove("show"); loadDb(); bar();
      toast("Заказ оформлен ✅ Ждём подтверждения продавца");
    })
    .catch(function(e){toast(e.message)})
    .then(function(){busy=false});
}
var ORDS = [];
var RF = ["Не устроил срок доставки","Не устроила цена","Нашёл дешевле в другом месте","Передумал покупать","Ошибся при оформлении заказа","Другая причина"];
function openRefuse(id){
  var o = ORDS.filter(function(x){return x.id===id})[0]; if(!o) return;
  $("panel").innerHTML = '<h2>Отказ от заказа №'+id+'</h2><div class="form"><div class="meta" style="margin-bottom:8px">Отметьте позиции, от которых отказываетесь:</div>'+
    o.items.map(function(i){return '<label class="item" style="margin:0 0 8px;cursor:pointer"><input type="checkbox" class="rfi" value="'+i.id+'" checked style="width:auto;margin:0;padding:0"><div class="t">'+esc(i.name)+'<div class="meta">× '+i.qty+' · '+fmt(i.price*i.qty)+'</div></div></label>'}).join("")+
    '<select id="rfr">'+RF.map(function(r){return '<option>'+r+'</option>'}).join("")+'</select>'+
    '<button class="btn" data-a="rfgo" data-id="'+id+'">Отказаться</button><button class="link" data-a="orders" style="margin-top:10px">← Назад к заказам</button></div>';
}
function doRefuse(id){
  var ids = [].slice.call(document.querySelectorAll(".rfi")).filter(function(c){return c.checked}).map(function(c){return +c.value});
  if(!ids.length) return toast("Выберите хотя бы одну позицию");
  if(busy) return; busy = true;
  api("cancel_order",{order_id:id,item_ids:ids,reason:$("rfr").value})
    .then(function(j){ toast(j.full?"Заказ отменён":"Позиции убраны из заказа"); loadDb(); openOrders(); })
    .catch(function(e){toast(e.message)})
    .then(function(){busy=false});
}
var CRN = {y:"Яндекс Доставка",c:"СДЭК"};
function askSupport(id){
  api("support_start",{order_id:id}).then(function(){toast("Откройте чат с ботом и ответьте на сообщение «Поддержка»"); if(tg&&tg.close) setTimeout(function(){tg.close()},1200)}).catch(function(e){toast(e.message)});
}
var STG = {"new":"⏳ Ждёт подтверждения продавца","confirmed":"✅ Заказ подтверждён","shipping":"🚚 Заказ в пути","delivered":"📦 Заказ доставлен","alt":"🔄 Продавец предложил другую дату — ответьте в чате с ботом","cancelled":"❌ Заказ отменён"};
function openOrders(){
  if (!INIT) return toast("Откройте магазин кнопкой меню у бота внутри Telegram");
  api("my_orders").then(function(j){ ORDS = j.orders;
    $("panel").innerHTML = '<h2>Мои заказы</h2>' + (j.orders.length ? j.orders.map(function(o){

function useImage(src, onerr){
  var im = new Image();
  im.onload = function(){
    var sc = Math.min(1, 600/Math.max(im.width,im.height)), cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(im.width*sc)); cv.height = Math.max(1, Math.round(im.height*sc));
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    photo = cv.toDataURL("image/jpeg",.75);
    $("prev").src = photo; $("prev").hidden = false; $("pt").textContent = "📷 Заменить фото";
    if (src.indexOf("blob:")===0) URL.revokeObjectURL(src);
  };
  im.onerror = function(){ if (src.indexOf("blob:")===0) URL.revokeObjectURL(src); onerr(); };
  im.src = src;
}
// RAW-файлы браузер не читает, но почти в каждом есть встроенное JPEG-превью: достаём самое большое
function rawPreview(f, ok, fail){
  var r = new FileReader();
  r.onload = function(){
    var b = new Uint8Array(r.result), starts = [];
    for (var i=0; i<b.length-3 && starts.length<10; i++) if (b[i]===255 && b[i+1]===216 && b[i+2]===255) starts.push(i);
    if (!starts.length) return fail();
    var best = null, k = 0;
    (function next(){
      if (k >= starts.length) return best ? ok(best.url) : fail();
      var url = URL.createObjectURL(new Blob([b.subarray(starts[k++])],{type:"image/jpeg"})), im = new Image();
      im.onload = function(){
        var px = im.naturalWidth*im.naturalHeight;
        if (!best || px > best.px) { if (best) URL.revokeObjectURL(best.url); best = {px:px,url:url}; } else URL.revokeObjectURL(url);
        next();
      };
      im.onerror = function(){ URL.revokeObjectURL(url); next(); };
      im.src = url;
    })();
  };
  r.readAsArrayBuffer(f);
}
function handleFile(f){
  if(!f) return;
  if (f.size > 120*1024*1024) return toast("Файл слишком большой");
  var fail = function(){ toast("Не удалось прочитать фото. Сохраните его как JPEG и попробуйте снова"); };
  var url = URL.createObjectURL(f);
  useImage(url, function(){ toast("Обрабатываем фото…"); rawPreview(f, function(u){ useImage(u, fail); }, fail); });
}

function statsHtml(s, admin){
  var t = s.totals, h = perChips();
  h += '<div class="kpi">'+[
    ["Выручка",fmt(t.revenue)],["Продано единиц",t.units],
    ["Заказы: в работе / продано",t.pending+" / "+t.sold_orders],["Средний чек",fmt(t.avg_check)],
    ["Отмены",t.cancelled+" ("+pct(t.cancelled,t.orders)+")"],[admin?"Покупателей":"Доставлено",admin?t.buyers:t.delivered]
  ].map(function(k){return '<div class="k"><span class="meta">'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join("")+'</div>';
  if (s.days.length) {
    var mx = Math.max.apply(null, s.days.map(function(d){return d.revenue}))||1;
    h += '<div class="sec" style="margin:6px 0">Выручка по дням</div><div class="bars">'+s.days.map(function(d){
      return '<i style="height:'+Math.max(3,Math.round(d.revenue*100/mx))+'%" title="'+dru(d.day)+': '+fmt(d.revenue)+'"></i>';
    }).join("")+'</div><div class="meta" style="padding:2px 14px 8px">'+dru(s.days[0].day)+' — '+dru(s.days[s.days.length-1].day)+'</div>';
  }
  h += '<div class="sec" style="margin:10px 0 4px">Товары</div><div class="tr h"><span>Товар</span><span>Шт.</span><span>Выручка</span><span>Цена</span></div>';
  h += s.products.length ? s.products.map(function(p){
    return '<div class="tr"><span>'+esc(p.name)+'</span><span>'+p.units+'</span><span>'+fmt(p.revenue)+'</span><span>'+fmt(p.avg)+(p.min!==p.max?'<div class="meta">'+fmt(p.min)+'–'+fmt(p.max)+'</div>':'')+'</span></div>';
  }).join("") : '<div class="empty" style="padding:14px">Продаж за период нет</div>';
  if (s.categories.length) {
    h += '<div class="sec" style="margin:14px 0 4px">Категории</div><div class="tr h"><span>Категория</span><span>Шт.</span><span>Выручка</span><span></span></div>'+s.categories.map(function(c){
      return '<div class="tr"><span>'+(C[c.category]?C[c.category].n:"Без категории")+'</span><span>'+c.units+'</span><span>'+fmt(c.revenue)+'</span><span></span></div>';
    }).join("");
  }
  if (admin && s.sellers && s.sellers.length) {
    h += '<div class="sec" style="margin:14px 0 4px">Продавцы</div><div class="tr s h"><span>Магазин</span><span>Заказов</span><span>Шт.</span><span>Выручка</span><span>Отмены</span></div>'+s.sellers.map(function(x){
      return '<div class="tr s"><span>'+esc(x.shop_name)+'</span><span>'+x.orders+'</span><span>'+x.units+'</span><span>'+fmt(x.revenue)+'</span><span>'+pct(x.cancelled,x.orders)+'</span></div>';
    }).join("");
  }
  if (s.reasons.length) {
    h += '<div class="sec" style="margin:14px 0 4px">Причины отмен</div>'+s.reasons.map(function(r){
      return '<div class="tr" style="grid-template-columns:4fr 1fr"><span>'+esc(r.reason)+'</span><span>'+r.n+'</span></div>';
    }).join("");
  }
  if (!admin && s.low_stock && s.low_stock.length) {
    h += '<div class="sec" style="margin:14px 0 4px">Заканчивается</div>'+s.low_stock.map(function(x){
      return '<div class="tr" style="grid-template-columns:4fr 1fr"><span>'+esc(x.name)+'</span><span>'+x.qty+' шт.</span></div>';
    }).join("");
  }
  return h;
}

document.addEventListener("click",function(e){
  if (e.target.id==="sheet") { e.target.classList.remove("show"); return; }
  var el = e.target.closest("[data-a]"); if(!el) return;
  var a = el.dataset.a, d = el.dataset;
  if (a==="role") setRole(d.r);
  else if (a==="switch") setRole(null);
  else if (a==="cat") { cat = +d.i; ty = -1; main(); window.scrollTo(0,0); }
  else if (a==="type") { ty = +d.i; main(); }
  else if (a==="home") { cat = null; ty = -1; Q = ""; $("q").value = ""; main(); }
  else if (a==="add") chg(d.id,1);
  else if (a==="orders") openOrders();
  else if (a==="sup") askSupport(+d.id);
  else if (a==="stats") openStats();
  else if (a==="per") { SP = +d.d; if (role==="admin") adminInit(); else openStats(); }
  else if (a==="rf") openRefuse(+d.id);
  else if (a==="rfgo") doRefuse(+d.id);
  else if (a==="sub") chg(d.id,-1);
  else if (a==="cart") openCart();
  else if (a==="co") checkout();
  else if (a==="pub") publish();
  else if (a==="reg") register();
  else if (a==="dec") decide(d.k,d.id,d.ok==="1");
  else if (a==="refresh") sellerInit();
  else if (a==="del") delProduct(d.id);
});
