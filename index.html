<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<title>ПУХ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --berry:#7A2E3B;--berry-h:#5F2330;--olive:#8A9A5B;--olive-d:#6E7C46;--powder:#F2C6C6;--cream:#FAF6F0;--card:#FFFFFF;--sand:#EFE7DB;
  --ink:#2B1F22;--ink2:#6B5C5F;--ink3:#A89A9C;--line:#E8DFD3;--div:#F0E8DC;--ok:#6E7C46;--warn:#B8803F;--err:#B84A5C;--info:#4F7494;--mint:#2F6B5F;
  --g0:linear-gradient(135deg,#F2C6C6,#FAF6F0);--g1:linear-gradient(135deg,#DCE3C6,#FAF6F0);--g2:linear-gradient(135deg,#EFE7DB,#FAF6F0);--g3:linear-gradient(135deg,#CFE2DB,#FAF6F0);
  --sh:0 2px 10px rgba(122,46,59,.07);
  box-sizing:border-box;padding-top:var(--sat);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--berry:#B5586C;--berry-h:#9C4A5D;--olive:#9AAA6B;--olive-d:#8FA15C;--powder:#4B3036;--cream:#1B1416;--card:#261D20;--sand:#33282B;--ink:#F6EEF0;--ink2:#C9B9BD;--ink3:#8F7F83;--line:#3B2F33;--div:#2F2528;--ok:#9AAA6B;--warn:#D4A574;--info:#8FB3CF;--mint:#7CC4B0;--sh:none;
  --g0:linear-gradient(135deg,#4B3036,#261D20);--g1:linear-gradient(135deg,#3A4128,#261D20);--g2:linear-gradient(135deg,#3A2F2B,#261D20);--g3:linear-gradient(135deg,#2B3F3A,#261D20)}}
:root[data-theme="dark"]{--berry:#B5586C;--berry-h:#9C4A5D;--olive:#9AAA6B;--olive-d:#8FA15C;--powder:#4B3036;--cream:#1B1416;--card:#261D20;--sand:#33282B;--ink:#F6EEF0;--ink2:#C9B9BD;--ink3:#8F7F83;--line:#3B2F33;--div:#2F2528;--ok:#9AAA6B;--warn:#D4A574;--info:#8FB3CF;--mint:#7CC4B0;--sh:none;
  --g0:linear-gradient(135deg,#4B3036,#261D20);--g1:linear-gradient(135deg,#3A4128,#261D20);--g2:linear-gradient(135deg,#3A2F2B,#261D20);--g3:linear-gradient(135deg,#2B3F3A,#261D20)}
html{--sat:calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top, 0px));
--sab:calc(var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + var(--tg-content-safe-area-inset-bottom, 0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.4 Manrope,"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(92px + var(--sab));-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
h1,h2,h3{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.ic.s{width:18px;height:18px}.ic.l{width:32px;height:32px}
.meta{color:var(--ink2);font-size:13px}.cap{color:var(--ink3);font-size:12px;font-weight:500}
.wrap{padding:0 16px}
.sec{font-size:20px;font-weight:700;margin:22px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec a,.link{color:var(--berry);font-size:14px;font-weight:700;background:none;border:0;cursor:pointer;padding:0}
/* верхняя панель */
.top{position:sticky;top:var(--sat);z-index:5;background:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:var(--berry);letter-spacing:-.5px}
.logo svg{width:30px;height:30px;fill:var(--berry);animation:breathe 3s ease-in-out infinite}
.logo i{color:var(--olive);font-style:normal}
.ibtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.ibtn .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--berry);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ttl{font-size:24px;font-weight:800;margin:6px 16px 12px;letter-spacing:-.4px}
/* поиск, чипы */
.search{display:flex;align-items:center;gap:10px;margin:4px 16px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;color:var(--ink3)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.chip.a{background:rgba(138,154,91,.2);border-color:transparent;color:var(--olive-d)}.chip.a.on{background:var(--olive-d);color:#fff}
.chip.c{background:var(--powder);border-color:transparent;color:var(--berry)}.chip.c.on{background:var(--berry);color:#fff}
.chip.t{background:rgba(107,140,168,.18);border-color:transparent;color:var(--info)}.chip.t.on{background:var(--info);color:#fff}
.cat.k0 span{background:rgba(212,165,116,.3);color:var(--warn)}.cat.k1 span{background:var(--powder);color:var(--berry)}.cat.k2 span{background:rgba(138,154,91,.24);color:var(--olive-d)}
.cat.k3 span{background:rgba(124,196,176,.26);color:var(--mint)}.cat.k4 span{background:rgba(107,140,168,.22);color:var(--info)}.cat.k5 span{background:var(--sand);color:var(--berry)}.cat.k6 span{background:rgba(124,196,176,.26);color:var(--mint)}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;font-size:34px;line-height:1;color:var(--line);cursor:pointer;padding:0 4px}.stars button.on{color:var(--warn)}
.rt,.pshop.rt{color:var(--warn);font-weight:800}
.cats{display:flex;gap:14px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;border:0;background:none;text-align:center;cursor:pointer;color:var(--ink2);font-size:12px;font-weight:700}
.cat span{width:60px;height:60px;border-radius:50%;background:var(--powder);color:var(--berry);display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.banner{margin:12px 16px;border-radius:24px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#7A2E3B,#9A4A58);position:relative;overflow:hidden}
.banner:before,.banner:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.1}
.banner:before{width:120px;height:120px;right:-30px;top:-30px}.banner:after{width:70px;height:70px;right:50px;bottom:-30px;background:var(--powder);opacity:.2}
.banner h2{font-size:21px;font-weight:800;line-height:1.2;max-width:230px}.banner p{margin:6px 0 14px;font-size:13px;opacity:.92;max-width:230px}
.banner button{border:0;border-radius:999px;background:#fff;color:var(--berry);font-weight:800;font-size:14px;padding:10px 18px;cursor:pointer}
/* карточки товара */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .pc{flex:none;width:158px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--sh)}
.ph{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:var(--berry);overflow:hidden}
.ph.g0{background:var(--g0)}.ph.g1{background:var(--g1)}.ph.g2{background:var(--g2)}.ph.g3{background:var(--g3)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .pe .ic{width:44px;height:44px;opacity:.6}
.bd{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);color:var(--berry);font-size:10px;font-weight:800;border-radius:999px;padding:4px 9px;z-index:1}
.fv{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--berry);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
.fv .ic{width:18px;height:18px}.fv.on .ic{fill:currentColor}.fv.pop{animation:pop .24s ease}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pn{font-weight:700;font-size:14px;line-height:1.25;height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pp{font-weight:800;font-size:17px;margin:6px 0 4px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills span{background:var(--sand);color:var(--ink2);border-radius:999px;font-size:11px;font-weight:700;padding:3px 8px}
.pills.big span{font-size:12px;padding:5px 11px}.pills .g{background:rgba(138,154,91,.2);color:var(--olive-d)}.pills .b{background:var(--powder);color:var(--berry)}
.pbot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;gap:6px;min-height:44px}
.pshop{font-size:11px;color:var(--ink3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cb{width:36px;height:36px;border-radius:50%;border:0;background:var(--berry);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cb .ic{width:18px;height:18px}.cb.in{background:var(--olive-d)}.cb.bump{animation:bump .3s ease}
.oos{font-size:11px;font-weight:700;color:var(--ink3)}
/* кнопки и поля */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:0;border-radius:12px;background:var(--berry);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin:8px 0}
.btn:active{background:var(--berry-h)}.btn.ol{background:var(--olive-d)}.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--err)}.btn[disabled]{opacity:.5}
.btn.sm{height:38px;font-size:13px;width:auto;padding:0 14px;margin:6px 6px 0 0;display:inline-flex}
.b2{border:1px solid var(--olive-d);background:none;color:var(--olive-d);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
.b2.red{border-color:var(--err);color:var(--err)}.b2.b{border-color:var(--berry);color:var(--berry)}
.fld{display:block;margin:0 0 12px}.fld>b{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.in{width:100%;height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
textarea.in{height:84px;padding:10px 14px;resize:none}.in:focus{border-color:var(--berry)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 16px 12px;box-shadow:var(--sh)}
.seg{display:flex;background:var(--sand);border-radius:14px;padding:4px;margin:0 16px 14px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer}.seg button.on{background:var(--card);color:var(--berry);box-shadow:var(--sh)}
/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
.tabs button{flex:1;border:0;background:none;color:var(--ink3);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tabs button.on{color:var(--berry)}
.tabs button.sell .circ{width:46px;height:46px;border-radius:50%;background:var(--berry);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(122,46,59,.35);border:3px solid var(--cream)}
.tabs button.sell{color:var(--berry)}
/* страницы поверх */
.pg{position:fixed;inset:0;z-index:20;background:var(--cream);display:none;flex-direction:column;padding-top:var(--sat);animation:slide .22s ease}
.pg.show{display:flex}
.phead{display:flex;align-items:center;gap:10px;padding:10px 16px}
.phead h2{flex:1;text-align:center;font-size:17px;font-weight:800;margin-right:42px}
.pbody{flex:1;overflow-y:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.pfoot{padding:10px 16px calc(10px + var(--sab));background:var(--cream);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.pfoot .btn{margin:0}.pfoot .ibtn{height:48px;width:52px;border-radius:12px;flex:none}
.hero{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;color:var(--berry)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero .ic{width:72px;height:72px;opacity:.5}
.price{font-size:28px;font-weight:800;color:var(--berry);text-align:center;margin:16px 0 4px}
.pt{font-size:20px;font-weight:800;text-align:center;margin:0 16px 12px;line-height:1.25}
.selr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 16px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8A9A5B,#6E7C46);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:17px}
.av.b{background:linear-gradient(135deg,#B5586C,#7A2E3B);width:68px;height:68px;font-size:28px}
.grp{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.4px;text-transform:uppercase;margin:16px 16px 8px;display:flex;align-items:center;gap:6px}
.grp .ic{color:var(--olive);width:16px;height:16px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:0 16px 10px}
.row .th{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;position:relative;display:flex;align-items:center;justify-content:center;color:var(--berry)}
.row .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px;line-height:1.25}
.stp{display:inline-flex;align-items:center;background:var(--sand);border-radius:999px;margin-top:6px}
.stp button{width:30px;height:30px;border-radius:50%;border:0;background:var(--card);margin:3px;font-size:18px;font-weight:700;color:var(--berry);cursor:pointer;line-height:1}
.stp span{min-width:26px;text-align:center;font-weight:800}
.sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 16px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink2)}
.sum .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-size:19px;font-weight:800;color:var(--ink)}.sum .tot b{color:var(--berry)}
.st{display:inline-block;border-radius:999px;font-size:11px;font-weight:800;padding:4px 10px;background:var(--sand);color:var(--ink2)}
.st.ok{background:rgba(138,154,91,.22);color:var(--olive-d)}.st.wn{background:rgba(212,165,116,.28);color:#8A5A1F}.st.er{background:rgba(184,74,92,.16);color:var(--err)}.st.in{background:rgba(79,116,148,.16);color:var(--info)}
.empty{text-align:center;padding:36px 28px}.empty h3{font-size:18px;font-weight:800;margin:14px 0 6px}.empty p{margin:0 0 16px;color:var(--ink2);font-size:14px}
.blob{position:relative;width:132px;height:112px;margin:0 auto}
.blob i{position:absolute;border-radius:50%;background:var(--powder)}
.blob i:nth-child(1){width:70px;height:70px;left:8px;top:30px}.blob i:nth-child(2){width:62px;height:62px;left:56px;top:10px}.blob i:nth-child(3){width:58px;height:58px;left:62px;top:50px}.blob i:nth-child(4){width:48px;height:48px;left:0;top:6px}
.blob .ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;color:var(--berry);z-index:1}
.role{display:block;width:calc(100% - 32px);margin:0 16px 14px;background:var(--card);border:2px solid var(--olive);border-radius:24px;padding:18px;text-align:left;cursor:pointer}
.role.s{border-color:var(--berry)}.role .ico{width:48px;height:48px;border-radius:14px;background:rgba(138,154,91,.2);color:var(--olive-d);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.role.s .ico{background:var(--powder);color:var(--berry)}.role b{font-size:19px;font-weight:800;display:block}.role p{margin:4px 0 14px;color:var(--ink2);font-size:13px}
.role .go{display:block;text-align:center;border-radius:12px;padding:13px;font-weight:700;color:#fff;background:var(--olive-d)}.role.s .go{background:var(--berry)}
.menu{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:0 16px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.menu .mi{width:40px;height:40px;border-radius:12px;background:var(--powder);color:var(--berry);display:flex;align-items:center;justify-content:center;flex:none}
.menu .mi.o{background:rgba(138,154,91,.22);color:var(--olive-d)}.menu span.t{flex:1}.menu small{display:block;color:var(--ink2);font-weight:500;font-size:12px;margin-top:2px}.menu>.ic:last-child{color:var(--ink3);width:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 14px}.tiles div{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:12px 4px}.tiles b{display:block;font-size:20px;font-weight:800;color:var(--berry)}.tiles span{font-size:11px;color:var(--ink2);font-weight:600}
.shopc{margin:0 16px 14px;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#8A9A5B,#6E7C46)}
.shopc h2{font-size:21px;font-weight:800}.shopc p{margin:4px 0 12px;opacity:.92;font-size:13px}.shopc .st{background:rgba(255,255,255,.22);color:#fff}
.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:112px;border:2px dashed var(--olive);border-radius:16px;background:var(--cream);color:var(--ink3);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:12px;position:relative;overflow:hidden}
.up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 10px}.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.k b{display:block;font-size:19px;font-weight:800;margin-top:2px}.k.w{grid-column:1/-1}.k.warn{background:rgba(212,165,116,.25);border-color:transparent}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;padding:0 16px;overflow:hidden}.bars i{flex:1;background:var(--olive);border-radius:4px 4px 0 0;min-height:3px}
.hb{display:grid;grid-template-columns:1.4fr 2fr auto;gap:8px;align-items:center;padding:4px 16px;font-size:13px}.hb div{background:var(--sand);border-radius:5px;height:10px}.hb i{display:block;height:100%;background:var(--berry);border-radius:5px}.hb b{font-weight:700}
.tr{display:grid;grid-template-columns:2.2fr .8fr 1.4fr 1.3fr;gap:6px;padding:9px 16px;border-bottom:1px solid var(--div);font-size:13px;align-items:start}.tr.h{font-weight:800;color:var(--ink3)}.tr.s{grid-template-columns:2fr .8fr .8fr 1.4fr 1fr}
.toast{position:fixed;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:14px;display:none;z-index:50;max-width:90%;text-align:center;font-size:14px;font-weight:600}
.tg{position:absolute;inset:0;display:none}

}

function fetchPts(c){
  if (PTS[c]) return Promise.resolve(PTS[c]);
  var all=[], page=0;
  function next(){
    return fetch(SB+"/rest/v1/pickup_points?select=id,name,address,lat,lon,work_time&carrier=eq."+c+"&order=id&limit=1000&offset="+(page*1000),{headers:{apikey:KEY,Authorization:"Bearer "+KEY}})
      .then(function(r){if(!r.ok)throw 0; return r.json()})
      .then(function(rows){ all=all.concat(rows); if(rows.length===1000&&page<14){page++;return next()} return all; });
  }
  return next().then(function(a){ a.forEach(function(p){PBY[p.id]=p}); PTS[c]=a; return a; });
}
function loadLeaflet(cb){
  if (window.L && L.markerClusterGroup) return cb();
  var base="https://cdnjs.cloudflare.com/ajax/libs/";
  ["leaflet/1.9.4/leaflet.min.css","leaflet.markercluster/1.5.3/MarkerCluster.css","leaflet.markercluster/1.5.3/MarkerCluster.Default.css"].forEach(function(u){var l=document.createElement("link");l.rel="stylesheet";l.href=base+u;document.head.appendChild(l)});
  var s1=document.createElement("script"); s1.src=base+"leaflet/1.9.4/leaflet.min.js";
  s1.onload=function(){var s2=document.createElement("script");s2.src=base+"leaflet.markercluster/1.5.3/leaflet.markercluster.js";s2.onload=cb;s2.onerror=function(){toast("Не удалось загрузить карту")};document.head.appendChild(s2)};
  s1.onerror=function(){toast("Не удалось загрузить карту")}; document.head.appendChild(s1);
}
function plist(arr){
  var el=$("plist"); if(!el) return;
  el.innerHTML=arr.slice(0,30).map(function(p){return '<div class="row"><div class="t"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.address)+(p.work_time?' · '+esc(p.work_time):'')+'</div></div><button class="b2 b" data-a="pick" data-id="'+esc(p.id)+'">Выбрать</button></div>'}).join("")+(arr.length>30?'<div class="meta wrap">Показаны первые 30 из '+arr.length+'. Уточните поиск.</div>':'');
}
function pMap(){
  var c=CHK.s;
  push("Пункты выдачи · "+SVC[c], function(){
    return '<div class="wrap"><label class="search" style="margin:4px 0 10px">'+ic("search","s")+'<input id="mq" placeholder="Поиск по адресу или названию" autocomplete="off"></label><div id="map" style="height:300px;border-radius:16px;margin-bottom:12px;background:var(--sand)"></div></div><div id="plist"></div>';
  }, null, function(){
    fetchPts(c).then(function(pts){
      if(!pts.length){ $("map").innerHTML='<div class="empty">Пункты выдачи '+SVC[c]+' пока не загружены. Выберите другой способ или «Курьером».</div>'; return; }

      });

  });

/* ===== Фото: квадрат, RAW ===== */
function useImage(src,onerr){
  var im=new Image();
  im.onload=function(){
    var side=Math.min(im.width,im.height), out=Math.max(1,Math.min(600,side)), cv=document.createElement("canvas");
    cv.width=out; cv.height=out; cv.getContext("2d").drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,out,out);
    photo=cv.toDataURL("image/jpeg",.78); if(src.indexOf("blob:")===0) URL.revokeObjectURL(src); render();
  };
  im.onerror=function(){ if(src.indexOf("blob:")===0) URL.revokeObjectURL(src); onerr(); };
  im.src=src;
}
function rawPreview(f,ok,fail){
  var r=new FileReader();
  r.onload=function(){
    var b=new Uint8Array(r.result), starts=[];
    for(var i=0;i<b.length-3&&starts.length<10;i++) if(b[i]===255&&b[i+1]===216&&b[i+2]===255) starts.push(i);
    if(!starts.length) return fail();
    var best=null,k=0;
    (function next(){
      if(k>=starts.length) return best?ok(best.url):fail();
      var url=URL.createObjectURL(new Blob([b.subarray(starts[k++])],{type:"image/jpeg"})), im=new Image();
      im.onload=function(){var px=im.naturalWidth*im.naturalHeight; if(!best||px>best.px){if(best)URL.revokeObjectURL(best.url); best={px:px,url:url}} else URL.revokeObjectURL(url); next()};
      im.onerror=function(){URL.revokeObjectURL(url); next()}; im.src=url;
    })();
  };
  r.readAsArrayBuffer(f);
}
function handleFile(f){
  if(!f) return; if(f.size>120*1024*1024) return toast("Файл слишком большой");
  var fail=function(){toast("Не удалось прочитать фото. Сохраните его как JPEG и попробуйте снова")};
  var url=URL.createObjectURL(f);
  useImage(url,function(){toast("Обрабатываем фото…"); rawPreview(f,function(u){useImage(u,fail)},fail)});
}

    (s.complaints?'<div class="k w"><span class="meta">Жалоб за период</span><b>'+s.complaints.count+'</b>'+(s.complaints.reasons.length?'<div class="meta">'+s.complaints.reasons.map(function(r){return esc(r.reason)+': '+r.n}).join(" · ")+'</div>':'')+'</div>':'')+'</div>';
  if(s.days.length){
    var mx=Math.max.apply(null,s.days.map(function(d){return d.revenue}))||1, mo=Math.max.apply(null,s.days.map(function(d){return d.orders}))||1;
    h+='<div class="sec" style="font-size:16px;margin:12px 16px 6px">Выручка по дням</div><div class="bars">'+s.days.map(function(d){return '<i style="height:'+Math.max(3,Math.round(d.revenue*100/mx))+'%" title="'+dru(d.day)+': '+fmt(d.revenue)+'"></i>'}).join("")+'</div><div class="cap" style="padding:2px 16px 8px">'+dru(s.days[0].day)+' — '+dru(s.days[s.days.length-1].day)+'</div>'+
      '<div class="sec" style="font-size:16px;margin:8px 16px 6px">Заказы по дням</div><div class="bars">'+s.days.map(function(d){return '<i style="height:'+Math.max(3,Math.round(d.orders*100/mo))+'%;background:var(--berry)" title="'+dru(d.day)+': '+d.orders+'"></i>'}).join("")+'</div>';
  }
  h+=hbars("Топ товаров по выручке",s.products.slice(0,8).map(function(p){return {l:p.name,v:p.revenue,t:fmt(p.revenue)}}));
  h+=hbars("Выручка по категориям",s.categories.map(function(c){return {l:C[c.category]?C[c.category].n:"Без категории",v:c.revenue,t:fmt(c.revenue)}}));
  if(admin&&s.sellers) h+=hbars("Топ продавцов по выручке",s.sellers.slice(0,8).map(function(x){return {l:x.shop_name,v:x.revenue,t:fmt(x.revenue)}}));
  h+=hbars("Причины отмен",s.reasons.map(function(r){return {l:r.reason,v:r.n,t:r.n}}));
  if(s.complaints) h+=hbars("Причины жалоб",s.complaints.reasons.map(function(r){return {l:r.reason,v:r.n,t:r.n}}));
  h+='<div class="sec" style="font-size:16px;margin:16px 16px 4px">Товары</div><div class="tr h"><span>Товар</span><span>Шт.</span><span>Выручка</span><span>Цена</span></div>';
  h+=s.products.length?s.products.map(function(p){return '<div class="tr"><span>'+esc(p.name)+'</span><span>'+p.units+'</span><span>'+fmt(p.revenue)+'</span><span>'+fmt(p.avg)+(p.min!==p.max?'<div class="cap">'+fmt(p.min)+'–'+fmt(p.max)+'</div>':'')+'</span></div>'}).join(""):'<div class="empty" style="padding:14px"><p>Продаж за период нет</p></div>';
  if(admin&&s.sellers&&s.sellers.length) h+='<div class="sec" style="font-size:16px;margin:16px 16px 4px">Продавцы</div><div class="tr s h"><span>Магазин</span><span>Заказов</span><span>Шт.</span><span>Выручка</span><span>Отмены</span></div>'+s.sellers.map(function(x){return '<div class="tr s"><span>'+esc(x.shop_name)+'</span><span>'+x.orders+'</span><span>'+x.units+'</span><span>'+fmt(x.revenue)+'</span><span>'+pct(x.cancelled,x.orders)+'</span></div>'}).join("");
  if(!admin&&s.low_stock&&s.low_stock.length) h+='<div class="sec" style="font-size:16px;margin:16px 16px 4px">Заканчивается</div>'+s.low_stock.map(function(x){return '<div class="tr" style="grid-template-columns:4fr 1fr"><span>'+esc(x.name)+'</span><span>'+x.qty+' шт.</span></div>'}).join("");
  return h;
}
function loadSellerStats(){ api("stats_seller",{days:SP}).then(function(s){SELL.stats=s; if(TAB==="sell"&&!STK.length) render();}).catch(function(e){toast(e.message)}); }

/* ===== Админ-панель ===== */
var AT="p", AS=0, ADM={h:'<div class="empty"><p>Загружаем…</p></div>'};
function adminTabs(){return '<div class="chips" style="padding-top:6px">'+[["p","Платформа"],["s","Продавцы"],["r","Заявки"]].map(function(x){return '<button class="chip'+(AT===x[0]?' on':'')+'" data-a="at" data-t="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}
function pAdmin(){ ADM.h='<div class="empty"><p>Загружаем…</p></div>'; push("Админ-панель", function(){return adminTabs()+ADM.h}, null); adminLoad(); }
function adminLoad(){
  ADM.h='<div class="empty"><p>Загружаем…</p></div>'; repage();
  var P_;
  if(AT==="p") P_=api("stats_admin",{days:SP}).then(function(s){return '<div class="wrap"><button class="btn gh" data-a="sync">Обновить пункты выдачи СДЭК</button></div>'+statsHtml(s,true,0)+'<div class="meta wrap" style="padding:8px 16px">В каталоге товаров: '+s.catalog.products+' · продавцов: '+s.catalog.sellers+'</div>'});
  else if(AT==="s"&&AS) P_=api("stats_admin_seller",{seller_id:AS,days:SP}).then(function(s){
    var p=s.profile;
    return '<div class="wrap"><button class="link" data-a="sback">← Все продавцы</button></div><div class="sec" style="margin-top:8px">'+esc(p.shop_name)+(p.blocked?' 🚫':(p.approved?'':' ⏳'))+'</div><div class="meta wrap" style="margin-bottom:8px">'+esc(p.status)+' · ИНН '+esc(p.inn)+' · '+esc(p.phone)+' · ID '+p.tg_id+'</div>'+
      '<div class="wrap"><button class="btn'+(p.blocked?' ol':' red')+'" data-a="blk" data-id="'+p.tg_id+'" data-b="'+(p.blocked?0:1)+'">'+(p.blocked?'Разблокировать магазин':'Заблокировать магазин')+'</button></div>'+statsHtml(s,false,AS)+
      '<div class="sec" style="font-size:16px">Товары продавца ('+s.products.length+')</div>'+(s.products.length?s.products.map(function(x){return '<div class="row"><div class="t"><b>'+esc(x.name)+'</b><div class="meta">'+fmt(+x.price)+' · остаток '+x.qty+(x.approved?'':' · скрыт')+'</div></div><button class="b2 red" data-a="apd" data-id="'+x.id+'">Удалить</button></div>'}).join(""):'<div class="empty" style="padding:12px"><p>Нет товаров</p></div>');
  });
  else if(AT==="s") P_=api("admin_sellers",{days:SP}).then(function(j){
    return perChips()+(j.sellers.length?j.sellers.map(function(x){return '<div class="row" data-a="sel" data-id="'+x.tg_id+'" style="cursor:pointer"><div class="t"><b>'+esc(x.shop_name)+'</b> '+(x.blocked?'🚫':(x.approved?'✅':'⏳'))+'<div class="meta">'+esc(x.status)+' · товаров: '+x.products+'</div><div class="meta">Заказов: '+x.orders+' · шт.: '+x.units+' · выручка: <b>'+fmt(x.revenue)+'</b>'+(x.cancelled?' · отмен: '+x.cancelled:'')+(x.complaints?' · жалоб: '+x.complaints:'')+(x.rating_cnt?' · <span class="rt">★ '+(+x.rating_avg).toFixed(1)+'</span> ('+x.rating_cnt+')':'')+'</div></div>'+ic("chev")+'</div>'}).join(""):'<div class="empty"><p>Продавцов пока нет</p></div>');
  });
  else P_=api("admin_list").then(function(j){
    return '<div class="sec" style="margin-top:8px">Заявки продавцов ('+j.sellers.length+')</div>'+(j.sellers.length?j.sellers.map(function(x){return '<div class="card"><b>'+esc(x.shop_name)+'</b><div class="meta">'+esc(x.status)+' · ИНН '+esc(x.inn)+' · '+esc(x.phone)+'</div><button class="btn sm ol" data-a="dec" data-k="seller" data-id="'+x.tg_id+'" data-ok="1">Одобрить</button><button class="btn sm red" data-a="dec" data-k="seller" data-id="'+x.tg_id+'" data-ok="0">Отклонить</button></div>'}).join(""):'<div class="empty"><p>Нет заявок</p></div>');
  });
  P_.then(function(h){ADM.h=h; repage()}).catch(function(e){ADM.h='<div class="empty"><p>'+esc(e.message)+'</p></div>'; repage()});
}
function decide(k,id,ok){
  if(busy) return; busy=true;
  api("admin_decide",{kind:k,id:id,ok:ok}).then(function(){adminLoad(); loadDb()}).catch(function(e){toast(e.message)}).then(function(){busy=false});
}

/* ===== События ===== */
function onAdminPage(){ return STK.length && STK[STK.length-1].t==="Админ-панель"; }
function roleChosen(r){
  ss("ps_role",r); document.querySelector("#tabs").style.display="";
  go(r==="seller"?"sell":"home");
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el) return;
  var a=el.getAttribute("data-a"), d=el.dataset, id=d.id;
  if (a==="tab") go(d.t);
  else if (a==="prod") pProduct(id);
  else if (a==="fav") { e.stopPropagation(); toggleFav(id); }
  else if (a==="addcart") { if (d.cb && cart[id]) pCart(); else chg(id,1); }
  else if (a==="sub") chg(id,-1);
  else if (a==="cart") { if (STK.length && STK[STK.length-1].t==="Корзина") return; pCart(); }
  else if (a==="checkout") pCheckout();
  else if (a==="co") checkout();
  else if (a==="svc") { if (CHK.s!==d.s) { CHK.s=d.s; CHK.v=null; } repage(); }
  else if (a==="map") pMap();
  else if (a==="pick") { CHK.v=PBY[id]||null; if(CHK.v){ toast("Пункт выдачи выбран"); if(STK.length&&/Пункты выдачи/.test(STK[STK.length-1].t)) pop(); } }
  else if (a==="pop") pop();
  else if (a==="cat") { F2.c=+d.i; F2.t=-1; go("catalog"); }
  else if (a==="cat2") { F2.c=+d.i; F2.t=-1; render(); }
  else if (a==="typ") { F2.t=+d.i; render(); }
  else if (a==="pet") { F2.pet=d.k; render(); }
  else if (a==="orders") { STK=[]; $("pg").classList.remove("show"); pOrders(); }
  else if (a==="support") pSupport();
  else if (a==="pk") pPick(d.k);
  else if (a==="rf") pRefuse(+id);
  else if (a==="rfgo") doRefuse(+id);
  else if (a==="rtn") pReturn(+id);
  else if (a==="rtgo") doReturn(+id);
  else if (a==="cmp") pComplaint(+id);
  else if (a==="cmpgo") doComplaint(+id);
  else if (a==="sup") askSupport(+id);
  else if (a==="role") { if ($("tabs").style.display==="none") roleChosen(d.r); else { ss("ps_role",d.r); if (d.r==="seller") go("sell"); else render(); } }
  else if (a==="home2") { STK=[]; $("pg").classList.remove("show"); go("home"); }
  else if (a==="sellref") sellLoad();
  else if (a==="reg") register();
  else if (a==="pub") publish();
  else if (a==="myf") { MYF=d.k; render(); }
  else if (a==="mydel") askOk("Удалить этот товар?",function(){ api("delete_product",{id:+id}).then(function(){toast("Товар удалён"); loadMine(); loadDb()}).catch(function(e){toast(e.message)}); });
  else if (a==="pfpet") { var i=PF.pets.indexOf(d.k); if(i>-1) PF.pets.splice(i,1); else PF.pets.push(d.k); render(); }
  else if (a==="cq") api("complaint_reply_start",{id:+id}).then(function(){toast("Откройте чат с ботом и ответьте на сообщение"); if(tg&&tg.close) setTimeout(function(){tg.close()},1200)}).catch(function(e){toast(e.message)});
  else if (a==="per") { SP=+d.d; if (onAdminPage()) adminLoad(); else loadSellerStats(); }
  else if (a==="exp") api("export_stats",{days:SP,scope:d.s,seller_id:+d.sid||0}).then(function(){toast("Файл отправлен вам в чат с ботом")}).catch(function(e){toast(e.message)});
  else if (a==="rate") pRate(+id);
  else if (a==="star") { RT.v[d.k]=+d.v; repage(); }
  else if (a==="ratego") doRate();
  else if (a==="admin") pAdmin();
  else if (a==="at") { AT=d.t; AS=0; adminLoad(); }
  else if (a==="sel") { AS=+id; adminLoad(); }
  else if (a==="sback") { AS=0; adminLoad(); }
  else if (a==="dec") decide(d.k,id,d.ok==="1");
  else if (a==="blk") askOk(+d.b?"Заблокировать магазин и скрыть все его товары?":"Снять блокировку и вернуть товары в каталог?",function(){ api("admin_block",{seller_id:+id,block:!!+d.b}).then(function(){toast("Готово"); adminLoad(); loadDb()}).catch(function(e){toast(e.message)}); });
  else if (a==="apd") askOk("Удалить этот товар?",function(){ api("admin_delete_product",{id:+id}).then(function(){toast("Товар удалён"); adminLoad(); loadDb()}).catch(function(e){toast(e.message)}); });
  else if (a==="sync") api("admin_sync_pvz").then(function(){toast("Обновление запущено. Результат придёт сообщением от бота")}).catch(function(e){toast(e.message)});
});
function onField(e){
  var t=e.target, f=t.getAttribute&&t.getAttribute("data-f"), pf=t.getAttribute&&t.getAttribute("data-pf"), rg=t.getAttribute&&t.getAttribute("data-rg");
  if (f) CHK[f]=t.value;
  else if (rg) RG[rg]=t.value;
  else if (pf) {
    if (pf==="c") { PF.c=+t.value; PF.t=0; if (e.type==="change") render(); }
    else if (pf==="t") PF.t=+t.value;
    else PF[pf]=t.value;
  }
  else if (t.id==="rtxt") RT.c=t.value;
  else if (t.id==="cq") { F2.q=t.value; var g=$("cgrid"); if(g){ var l=filtered(); g.innerHTML=l.length?'<div class="grid" style="margin-top:4px">'+l.map(card).join("")+'</div>':emptyState("search","Ничего не нашли","Попробуйте изменить фильтры или поисковый запрос."); } }
}
document.addEventListener("input",onField);
["gesturestart","gesturechange","gestureend"].forEach(function(n){ document.addEventListener(n,function(e){e.preventDefault()}); });
var lastTap=0; document.addEventListener("touchend",function(e){ var t=Date.now(); if(t-lastTap<350 && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) e.preventDefault(); lastTap=t; },{passive:false});
document.addEventListener("change",function(e){
  if (e.target.id==="file") return handleFile(e.target.files[0]);
  onField(e);
});
document.addEventListener("keydown",function(e){
  if (e.key==="Enter" && e.target.id==="hq") { F2.q=e.target.value; F2.c=-1; F2.t=-1; go("catalog"); }
  else if (e.key==="Enter" && e.target.id==="cq") e.target.blur();
});

/* ===== старт ===== */
var startRole = ls("ps_role",null);
if (!startRole) { roleScreen(); }
else { go(startRole==="seller" ? "sell" : "home"); }
loadDb();
if (INIT) api("me").then(function(j){ ME=j; SELL.me=SELL.me||j; }).catch(function(){});

</script>
